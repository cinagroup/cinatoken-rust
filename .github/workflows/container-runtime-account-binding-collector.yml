name: container-runtime-account-binding-collector

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-account-binding-collector.yml"
      - "bun.lock"
      - "package.json"
      - "tests/container-runtime-json-compatibility-account-binding-*.test.mjs"
      - "tests/container-runtime-json-compatibility-bounded-file.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-archive.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-cli.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-closure.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3.test.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-deployment-transition.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-source-authentication.mjs"
      - "tools/assemble_container_runtime_json_compatibility_account_binding_profile.*"
      - "tools/collect_container_runtime_json_compatibility_account_bindings.*"
      - "tools/sign_container_runtime_json_compatibility_account_binding_credential.*"
      - "tools/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/container_runtime_json_compatibility_account_binding_evidence.*"
      - "tools/container_runtime_json_compatibility_account_binding_raw_capture.*"
      - "tools/container_runtime_json_compatibility_campaign.mjs"
      - "tools/container_runtime_json_compatibility_deployment_states.mjs"
      - "tools/container_runtime_json_compatibility_external_worm_archive.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_closure.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_observation.*"
      - "tools/container_runtime_json_compatibility_source_authentication.*"
      - "tools/lib/container_runtime_json_compatibility_account_binding_collector.*"
      - "tools/lib/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/lib/container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/run_container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/lib/bounded_json_file.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-account-binding-collector.yml"
      - "bun.lock"
      - "package.json"
      - "tests/container-runtime-json-compatibility-account-binding-*.test.mjs"
      - "tests/container-runtime-json-compatibility-bounded-file.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-archive.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-cli.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-closure.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3.test.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-deployment-transition.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-source-authentication.mjs"
      - "tools/assemble_container_runtime_json_compatibility_account_binding_profile.*"
      - "tools/collect_container_runtime_json_compatibility_account_bindings.*"
      - "tools/sign_container_runtime_json_compatibility_account_binding_credential.*"
      - "tools/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/container_runtime_json_compatibility_account_binding_evidence.*"
      - "tools/container_runtime_json_compatibility_account_binding_raw_capture.*"
      - "tools/container_runtime_json_compatibility_campaign.mjs"
      - "tools/container_runtime_json_compatibility_deployment_states.mjs"
      - "tools/container_runtime_json_compatibility_external_worm_archive.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_closure.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_observation.*"
      - "tools/container_runtime_json_compatibility_source_authentication.*"
      - "tools/lib/container_runtime_json_compatibility_account_binding_collector.*"
      - "tools/lib/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/lib/container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/run_container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/lib/bounded_json_file.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-account-binding-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-binding-collector-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify external WORM archive contract and S3 data plane
        run: bun run check:container-runtime:json-compatibility-external-worm

      - name: Verify account binding evidence and collector safety
        run: bun run check:container-runtime:json-compatibility-account-binding-collector
