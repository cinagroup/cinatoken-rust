name: container-runtime-contracts

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-contracts.yml"
      - "buf.yaml"
      - "bun.lock"
      - "package.json"
      - "contracts/container-runtime/**"
      - "crates/container-runtime/**"
      - "services/container-controller/src/container_runtime_contract.ts"
      - "services/container-controller/src/operation_outcome.ts"
      - "services/container-controller/src/protocol.ts"
      - "tests/container-runtime-contract-parity.test.mjs"
      - "tests/types/container-runtime-contract-types.ts"
      - "tests/types/tsconfig.container-runtime-contract.json"
      - "tools/verify_container_runtime_contracts.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-contracts.yml"
      - "buf.yaml"
      - "bun.lock"
      - "package.json"
      - "contracts/container-runtime/**"
      - "crates/container-runtime/**"
      - "services/container-controller/src/container_runtime_contract.ts"
      - "services/container-controller/src/operation_outcome.ts"
      - "services/container-controller/src/protocol.ts"
      - "tests/container-runtime-contract-parity.test.mjs"
      - "tests/types/container-runtime-contract-types.ts"
      - "tests/types/tsconfig.container-runtime-contract.json"
      - "tools/verify_container_runtime_contracts.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify OpenAPI, Protobuf, and TypeScript parity
        run: bun run check:container-runtime:contracts

      - name: Reject protobuf breaking changes against the pull request base
        if: github.event_name == 'pull_request'
        run: node node_modules/@bufbuild/buf/bin/buf breaking --against ".git#ref=${{ github.event.pull_request.base.sha }}"

      - name: Verify Rust consumes the shared vectors
        run: cargo test -p cinatoken-container-runtime
