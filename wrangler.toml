# cinatoken-rust-api Wrangler configuration.
#
# Environment layout:
#   - Top level (no [env.*]) is the local development shape. Bindings here use
#     placeholder IDs that are safe for `wrangler dev` against local D1.
#   - [env.staging] targets the production-shaped staging Worker. The staging
#     D1/KV/R2/Queue bindings are already populated with real resource IDs; only
#     secrets remain to be set via `wrangler secret put --env staging`. See
#     docs/cloudflare-production-config-checklist.md for the SOP.
#   - [env.production] targets the customer-facing Worker. Replace every
#     `REPLACE_WITH_PRODUCTION_*` placeholder before
#     `wrangler deploy --env production`. Production deploy is gated by G8 in
#     docs/production-migration-execution-plan.md.
#
# Staging resource IDs are committed on purpose (they are not secrets) so the
# staging target is deployable as-is; production IDs stay as placeholders until
# G8 sign-off. Actual secret values (Upstash tokens, provider keys, JWT/session
# secrets, payment secrets) must be set via `wrangler secret put --env <env>`
# and never written into this file.

name = "cinatoken-rust-api"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[build]
command = "bun tools/build_worker.mjs --release"

# Static admin frontend. `directory` is populated by `bun run build:web`
# (see apps/web/README.md). When the directory is absent (e.g. a fresh
# checkout that has not built the frontend yet) Wrangler will refuse to
# deploy; either run the build or temporarily comment this block out.
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Workers AI binding: lets type-39 (Cloudflare) relay channels with the
# `internal` key run models in-platform (no egress, no API token). Inert for
# all other channels. `AI_GATEWAY_ID` (below) optionally routes binding calls
# through an AI Gateway for analytics/caching.
[ai]
binding = "AI"

# Relay admission limits use Cloudflare's in-process Rate Limiting binding.
# Namespace IDs are account-local numeric identifiers, not credentials or
# provisioned resource IDs. Keep each environment/scope pair distinct.
[[ratelimits]]
name = "RELAY_TOKEN_RATE_LIMITER"
namespace_id = "5100101"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "RELAY_IP_RATE_LIMITER"
namespace_id = "5100102"

[ratelimits.simple]
limit = 600
period = 60

[vars]
ENVIRONMENT = "development"
FRONTEND_BASE_URL = "http://localhost:3000"
RELAY_RATE_LIMIT_BACKEND = "native"
AI_GATEWAY_ID = ""
CLOUDFLARE_ACCOUNT_ID = ""
RELAY_AI_GATEWAY_ROUTER_ENABLED = "false"
RELAY_MODEL_FALLBACK_ENABLED = "false"
RELAY_MODEL_FALLBACKS_JSON = "{}"
RELAY_MODEL_FALLBACK_STAGING_VERIFIED = "false"
RELAY_ACTUAL_GROUP_BILLING_STAGING_SMOKE_ENABLED = "false"
RELAY_BILLING_RESERVATION_LEASE_SECONDS = "3600"
RELAY_BILLING_STREAM_LEASE_HEARTBEAT_SECONDS = "900"
RELAY_BILLING_STREAM_LEASE_RENEWAL_STAGING_VERIFIED = "false"
RELAY_BILLING_STREAM_ERROR_USAGE_RECOVERY_STAGING_VERIFIED = "false"
RELAY_BILLING_FINALIZATION_REPLAY_STAGING_VERIFIED = "false"
RELAY_BILLING_ORPHAN_RECOVERY_ENABLED = "false"
RELAY_BILLING_ORPHAN_SWEEP_LIMIT = "32"
WFP_DISPATCH_ENABLED = "false"
WFP_INTERNAL_DISPATCH_ENABLED = "false"
WFP_RELAY_TRANSPORT_ENABLED = "false"
WFP_PREVIEW_HOST_SUFFIX = ""
WFP_DISPATCH_WORKER_PREFIX = ""
WFP_DISPATCH_NAMESPACE = ""
WFP_TENANT_COMPATIBILITY_DATE = "2026-06-17"
REALTIME_SESSION_GATEWAY_ENABLED = "false"
REALTIME_SESSION_V1_ENABLED = "false"
REALTIME_BILLING_SETTLEMENT_WRITE_ENABLED = "false"
REALTIME_BILLING_RESERVATION_LEASE_SECONDS = "900"
REALTIME_BILLING_ORPHAN_RECOVERY_ENABLED = "false"
REALTIME_BILLING_ORPHAN_SWEEP_LIMIT = "32"
REALTIME_SETTLEMENT_STAGING_SMOKE_ENABLED = "false"
TASK_RUNNER_DO_ENABLED = "false"
TASK_RUNNER_STAGING_REPLAY_VERIFIED = "false"
TASK_RUNNER_MAX_ALARM_FIRES = "20"
# Async-task cron poller: Worker keeps a conservative per-family batch window,
# with a Go-compatible timeout sweep before normal provider polling.
TASK_QUERY_LIMIT = "100"
TASK_TIMEOUT_MINUTES = "1440"

# Workers for Platforms dispatch namespace. Create the namespace first, then
# uncomment in the environment that should accept tenant/preview traffic:
#   wrangler dispatch-namespace create cinatoken-rust-tenants
# [[dispatch_namespaces]]
# binding = "DISPATCHER"
# namespace = "cinatoken-rust-tenants"
# [dispatch_namespaces.outbound]
# service = "cinatoken-wfp-outbound"
# parameters = ["CINATOKEN_WFP_OUTBOUND_CONTEXT"]

[[d1_databases]]
binding = "DB"
database_name = "cinatoken-rust-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/d1"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "00000000000000000000000000000000"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "cinatoken-rust-files"

[[queues.producers]]
queue = "cinatoken-rust-log-events"
binding = "LOG_QUEUE"

[[queues.producers]]
queue = "cinatoken-rust-task-events"
binding = "TASK_QUEUE"

# LOG_QUEUE consumer: drains relay audit events in batches of up to 100
# messages or every 5 seconds (whichever comes first), then bulk-INSERTs
# them into D1 in a single round-trip. Failed batches retry up to 3 times
# before landing in the dead-letter queue for manual inspection.
# Create the DLQ before first deploy:
#   wrangler queues create cinatoken-rust-log-events-dlq
[[queues.consumers]]
queue = "cinatoken-rust-log-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "cinatoken-rust-log-events-dlq"

# Channel-affinity (sticky-routing) Durable Object. Inert at runtime unless
# RELAY_CHANNEL_AFFINITY_ENABLED is set, so deploying the binding alone changes
# nothing. SQLite-backed (requires the compatibility_date above).
[[durable_objects.bindings]]
name = "CHANNEL_AFFINITY"
class_name = "ChannelAffinity"

[[durable_objects.bindings]]
name = "REALTIME_SESSIONS"
class_name = "RealtimeSession"

[[durable_objects.bindings]]
name = "TASK_RUNNER"
class_name = "TaskRunner"

[[durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"

[[durable_objects.bindings]]
name = "PASSKEY_CEREMONIES"
class_name = "PasskeyCeremony"

[[migrations]]
tag = "v1-channel-affinity"
new_sqlite_classes = ["ChannelAffinity"]

[[migrations]]
tag = "v2-realtime-session"
new_sqlite_classes = ["RealtimeSession"]

[[migrations]]
tag = "v3-task-runner"
new_sqlite_classes = ["TaskRunner"]

[[migrations]]
tag = "v4-wfp-authority-replay"
new_sqlite_classes = ["WfpAuthorityReplay"]

[[migrations]]
tag = "v5-passkey-ceremony"
new_sqlite_classes = ["PasskeyCeremony"]

