name: container-runtime-source-verifier

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-source-verifier.yml"
      - "bun.lock"
      - "package.json"
      - "services/container-runtime-json-compatibility-source-verifier/**"
      - "services/container-runtime-json-compatibility-source-publisher/**"
      - "services/container-runtime-json-compatibility-deployment-readback/**"
      - "services/container-runtime-json-compatibility-deployment-mutation/**"
      - "services/container-runtime-json-compatibility-deployment-transition/**"
      - "services/container-runtime-json-compatibility-deployment-resolution/**"
      - "tests/container-runtime-json-compatibility-deployment-resolution.test.mjs"
      - "tests/container-runtime-json-compatibility-deployment-transition.test.mjs"
      - "tests/container-runtime-json-compatibility-source-publication.test.mjs"
      - "tests/container-runtime-json-compatibility-account-binding-*.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-archive.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-cli.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-closure.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3.test.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-deployment-transition.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-source-authentication.mjs"
      - "tools/container_runtime_json_compatibility_campaign.mjs"
      - "tools/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/container_runtime_json_compatibility_account_binding_evidence.*"
      - "tools/container_runtime_json_compatibility_account_binding_raw_capture.*"
      - "tools/lib/bounded_json_file.mjs"
      - "tools/container_runtime_json_compatibility_deployment_states.mjs"
      - "tools/container_runtime_json_compatibility_deployment_transition.*"
      - "tools/container_runtime_json_compatibility_deployment_resolution.*"
      - "tools/container_runtime_json_compatibility_external_worm_archive.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_closure.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_observation.*"
      - "tools/container_runtime_json_compatibility_source_authentication.*"
      - "tools/container_runtime_json_compatibility_source_publication.*"
      - "tools/sign_container_runtime_json_compatibility_source_bundle.*"
      - "tools/assemble_container_runtime_json_compatibility_source_publication.*"
      - "tools/assemble_container_runtime_json_compatibility_source_signature_subject.*"
      - "tools/container_runtime_json_compatibility_source_manifest.mjs"
      - "tools/lib/container_runtime_json_compatibility_account_binding_collector.*"
      - "tools/lib/container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/run_container_runtime_json_compatibility_external_worm_s3.*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-source-verifier.yml"
      - "bun.lock"
      - "package.json"
      - "services/container-runtime-json-compatibility-source-verifier/**"
      - "services/container-runtime-json-compatibility-source-publisher/**"
      - "services/container-runtime-json-compatibility-deployment-readback/**"
      - "services/container-runtime-json-compatibility-deployment-mutation/**"
      - "services/container-runtime-json-compatibility-deployment-transition/**"
      - "services/container-runtime-json-compatibility-deployment-resolution/**"
      - "tests/container-runtime-json-compatibility-deployment-resolution.test.mjs"
      - "tests/container-runtime-json-compatibility-deployment-transition.test.mjs"
      - "tests/container-runtime-json-compatibility-source-publication.test.mjs"
      - "tests/container-runtime-json-compatibility-account-binding-*.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-archive.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-cli.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3-closure.test.mjs"
      - "tests/container-runtime-json-compatibility-external-worm-s3.test.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-deployment-transition.mjs"
      - "tests/fixtures/container-runtime-json-compatibility-source-authentication.mjs"
      - "tools/container_runtime_json_compatibility_campaign.mjs"
      - "tools/container_runtime_json_compatibility_account_binding_credentials.*"
      - "tools/container_runtime_json_compatibility_account_binding_evidence.*"
      - "tools/container_runtime_json_compatibility_account_binding_raw_capture.*"
      - "tools/lib/bounded_json_file.mjs"
      - "tools/container_runtime_json_compatibility_deployment_states.mjs"
      - "tools/container_runtime_json_compatibility_deployment_transition.*"
      - "tools/container_runtime_json_compatibility_deployment_resolution.*"
      - "tools/container_runtime_json_compatibility_external_worm_archive.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_closure.*"
      - "tools/container_runtime_json_compatibility_external_worm_s3_observation.*"
      - "tools/container_runtime_json_compatibility_source_authentication.*"
      - "tools/container_runtime_json_compatibility_source_publication.*"
      - "tools/sign_container_runtime_json_compatibility_source_bundle.*"
      - "tools/assemble_container_runtime_json_compatibility_source_publication.*"
      - "tools/assemble_container_runtime_json_compatibility_source_signature_subject.*"
      - "tools/container_runtime_json_compatibility_source_manifest.mjs"
      - "tools/lib/container_runtime_json_compatibility_account_binding_collector.*"
      - "tools/lib/container_runtime_json_compatibility_external_worm_s3.*"
      - "tools/run_container_runtime_json_compatibility_external_worm_s3.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-source-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-source-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install frozen JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Verify transition and source-authentication contracts
        run: bun run check:container-runtime:json-compatibility-deployment-transition

      - name: Verify external WORM archive contract and S3 data plane
        run: bun run check:container-runtime:json-compatibility-external-worm

      - name: Verify account-wide binding evidence and collector safety
        run: bun run check:container-runtime:json-compatibility-account-binding-collector

      - name: Verify private C4 source publisher and verifier
        run: bun run check:container-runtime:json-compatibility-source-verifier

      - name: Verify private deployment Reader
        run: bun run check:container-runtime:json-compatibility-deployment-readback

      - name: Verify create-once deployment Mutator
        run: bun run check:container-runtime:json-compatibility-deployment-mutation

      - name: Verify transition integration through the real source verifier
        run: bun run check:container-runtime:json-compatibility-deployment-transition-worker

      - name: Verify Reader-only deployment inflight resolution
        run: bun run check:container-runtime:json-compatibility-deployment-resolution
