[package]
name = "cinatoken-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait.workspace = true
cinatoken-api = { path = "../api" }
cinatoken-billing = { path = "../billing" }
cinatoken-cache = { path = "../cache" }
cinatoken-core = { path = "../core" }
cinatoken-relay = { path = "../relay" }
cinatoken-storage = { path = "../storage" }
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }
js-sys = "0.3"
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
worker = { workspace = true, features = ["d1"] }
