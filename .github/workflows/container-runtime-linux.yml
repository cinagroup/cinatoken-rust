name: container-runtime-linux

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "tests/container-runtime-linux-gate.test.mjs"
      - "tests/fixtures/container-runtime-linux-mock.mjs"
      - "tests/fixtures/container-runtime-linux-probe.mjs"
      - "tools/lib/bounded_subprocess.mjs"
      - "tools/verify_container_runtime_linux.mjs"
      - "package.json"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "tests/container-runtime-linux-gate.test.mjs"
      - "tests/fixtures/container-runtime-linux-mock.mjs"
      - "tests/fixtures/container-runtime-linux-probe.mjs"
      - "tools/lib/bounded_subprocess.mjs"
      - "tools/verify_container_runtime_linux.mjs"
      - "package.json"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify credential-free gate contract
        run: node tools/verify_container_runtime_linux.mjs --self-test --json

      - name: Build linux/amd64 runtime image
        run: docker build --platform linux/amd64 --tag cinatoken-container-runtime:linux-gate --file crates/container-runtime/Dockerfile .

      - name: Exercise isolated runtime process
        shell: bash
        run: |
          set -o pipefail
          evidence_dir="${RUNNER_TEMP}/container-runtime-linux"
          mkdir -p "${evidence_dir}"
          node tools/verify_container_runtime_linux.mjs \
            --image cinatoken-container-runtime:linux-gate \
            --json \
            2> >(tee "${evidence_dir}/container-runtime-linux-attestation.log" >&2) |
            tee "${evidence_dir}/container-runtime-linux-attestation.json"

      - name: Retain runtime attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-runtime-linux-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/container-runtime-linux/*.json
            ${{ runner.temp }}/container-runtime-linux/*.log
          if-no-files-found: ignore
          retention-days: 30
