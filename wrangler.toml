# cinatoken-rust-api Wrangler configuration.
#
# Environment layout:
#   - Top level (no [env.*]) is the local development shape. Bindings here use
#     placeholder IDs that are safe for `wrangler dev` against local D1.
#   - [env.staging] targets the production-shaped staging Worker. The staging
#     D1/KV/R2/Queue bindings are already populated with real resource IDs; only
#     secrets remain to be set via `wrangler secret put --env staging`. See
#     docs/cloudflare-production-config-checklist.md for the SOP.
#   - [env.production] targets the customer-facing Worker. Replace every
#     `REPLACE_WITH_PRODUCTION_*` placeholder before
#     `wrangler deploy --env production`. Production deploy is gated by G8 in
#     docs/production-migration-execution-plan.md.
#
# Staging resource IDs are committed on purpose (they are not secrets) so the
# staging target is deployable as-is; production IDs stay as placeholders until
# G8 sign-off. Actual secret values (Upstash tokens, provider keys, JWT/session
# secrets, payment secrets) must be set via `wrangler secret put --env <env>`
# and never written into this file.

name = "cinatoken-rust-api"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

[observability]
enabled = true
head_sampling_rate = 1

[build]
command = "bun tools/build_worker.mjs --release"

# Static admin frontend. `directory` is populated by `bun run build:web`
# (see apps/web/README.md). When the directory is absent (e.g. a fresh
# checkout that has not built the frontend yet) Wrangler will refuse to
# deploy; either run the build or temporarily comment this block out.
[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/internal/*", "/v1/*"]

# Workers AI binding: lets type-39 (Cloudflare) relay channels with the
# `internal` key run models in-platform (no egress, no API token). Inert for
# all other channels. `AI_GATEWAY_ID` (below) optionally routes binding calls
# through an AI Gateway for analytics/caching.
[ai]
binding = "AI"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Private, capability-scoped Worker-to-Worker paths. Each target must be
# deployed before this caller; no public target URL is used.
[[services]]
binding = "CONTAINER_CONTROLLER"
service = "cinatoken-container-controller-local"

[[services]]
binding = "SHARD_PLACEMENT_AUTHORITY"
service = "cinatoken-shard-placement-authority-local"

[[services]]
binding = "DRAIN_SOURCE_REGISTRATION_COORDINATOR"
service = "cinatoken-drain-source-registration-coordinator-local"

# Relay admission limits use Cloudflare's in-process Rate Limiting binding.
# Namespace IDs are account-local numeric identifiers, not credentials or
# provisioned resource IDs. Keep each environment/scope pair distinct.
[[ratelimits]]
name = "RELAY_TOKEN_RATE_LIMITER"
namespace_id = "5100101"

[ratelimits.simple]
limit = 120
period = 60

[[ratelimits]]
name = "RELAY_IP_RATE_LIMITER"
namespace_id = "5100102"

[ratelimits.simple]
limit = 600
period = 60

