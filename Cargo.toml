[workspace]
members = [
  "crates/api",
  "crates/auth",
  "crates/billing",
  "crates/cache",
  "crates/container-authority",
  "crates/container-runtime",
  "crates/coordinator",
  "crates/core",
  "crates/gateway",
  "crates/migration",
  "crates/observability",
  "crates/payments",
  "crates/providers",
  "crates/relay",
  "crates/session",
  "crates/sharding",
  "crates/ssrf",
  "crates/storage",
  "crates/tasks",
  "crates/tokenizer",
  "crates/worker",
  "crates/wfp-outbound",
  "crates/wfp-tenant",
  "crates/wfp-authority",
  "crates/xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/cinagroup/cinatoken-rust"
rust-version = "1.78"

[workspace.dependencies]
async-trait = "0.1"
axum = "=0.7.9"
base64 = "0.22"
bcrypt = "0.15"
hmac = "0.12"
ipnet = "2"
md5 = "0.7"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "=1.41.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "=0.5.1", features = ["util"] }
unicode-segmentation = "1"
url = "2"
worker = "0.5"
