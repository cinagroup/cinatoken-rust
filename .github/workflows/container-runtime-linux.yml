name: container-runtime-linux

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "contracts/container-runtime/**"
      - "tests/container-runtime-linux-gate.test.mjs"
      - "tests/fixtures/container-runtime-linux-mock.mjs"
      - "tests/fixtures/container-runtime-linux-probe.mjs"
      - "tools/lib/bounded_subprocess.mjs"
      - "tools/verify_container_runtime_linux.mjs"
      - "package.json"
      - "bun.lock"
      - "buf.yaml"
      - "tests/container-runtime-contract-parity.test.mjs"
      - "tools/verify_container_runtime_contracts.mjs"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "contracts/container-runtime/**"
      - "tests/container-runtime-linux-gate.test.mjs"
      - "tests/fixtures/container-runtime-linux-mock.mjs"
      - "tests/fixtures/container-runtime-linux-probe.mjs"
      - "tools/lib/bounded_subprocess.mjs"
      - "tools/verify_container_runtime_linux.mjs"
      - "package.json"
      - "bun.lock"
      - "buf.yaml"
      - "tests/container-runtime-contract-parity.test.mjs"
      - "tools/verify_container_runtime_contracts.mjs"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-amd64-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify credential-free gate contract
        run: node tools/verify_container_runtime_linux.mjs --self-test --json

      - name: Build two independent linux/amd64 runtime images
        run: |
          docker buildx build --no-cache --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --output type=image,rewrite-timestamp=true \
            --tag cinatoken-container-runtime:linux-gate-a \
            --file crates/container-runtime/Dockerfile .
          docker buildx build --no-cache --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --output type=image,rewrite-timestamp=true \
            --tag cinatoken-container-runtime:linux-gate-b \
            --file crates/container-runtime/Dockerfile .

      - name: Exercise isolated runtime process
        shell: bash
        run: |
          set -o pipefail
          evidence_dir="${RUNNER_TEMP}/container-runtime-linux"
          mkdir -p "${evidence_dir}"
          docker image inspect cinatoken-container-runtime:linux-gate-a \
            > "${evidence_dir}/container-runtime-linux-image-a.json"
          docker image inspect cinatoken-container-runtime:linux-gate-b \
            > "${evidence_dir}/container-runtime-linux-image-b.json"
          : > "${evidence_dir}/container-runtime-linux-binary-sha256.log"
          for suffix in a b; do
            image="cinatoken-container-runtime:linux-gate-${suffix}"
            container_id="$(docker create "${image}")"
            binary="${evidence_dir}/container-runtime-linux-binary-${suffix}"
            docker cp \
              "${container_id}:/usr/local/bin/cinatoken-container-runtime" \
              "${binary}"
            docker rm "${container_id}" > /dev/null
            printf '%s %s\n' "${image}" "$(sha256sum "${binary}" | cut -d ' ' -f 1)" \
              >> "${evidence_dir}/container-runtime-linux-binary-sha256.log"
            rm "${binary}"
          done
          node tools/verify_container_runtime_linux.mjs \
            --image cinatoken-container-runtime:linux-gate-a \
            --reproducible-image cinatoken-container-runtime:linux-gate-b \
            --json \
            2> >(tee "${evidence_dir}/container-runtime-linux-attestation.log" >&2) |
            tee "${evidence_dir}/container-runtime-linux-attestation.json"

      - name: Retain runtime attestation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: container-runtime-linux-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/container-runtime-linux/*.json
            ${{ runner.temp }}/container-runtime-linux/*.log
          if-no-files-found: ignore
          retention-days: 30
