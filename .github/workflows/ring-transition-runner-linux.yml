name: ring-transition-runner-linux

on:
  pull_request:
    paths:
      - ".github/workflows/ring-transition-runner-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/ring-transition-runner/**"
      - "tools/verify_ring_transition_runner_syscall_trace.mjs"
      - "tests/ring-transition-runner-syscall-trace.test.mjs"
      - "tools/collect_ring_transition_runner_release_source.mjs"
      - "tools/relay_container_ring_transition_release_contract.mjs"
      - "tests/relay-container-ring-transition-release*.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ring-transition-runner-linux.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/ring-transition-runner/**"
      - "tools/verify_ring_transition_runner_syscall_trace.mjs"
      - "tests/ring-transition-runner-syscall-trace.test.mjs"
      - "tools/collect_ring_transition_runner_release_source.mjs"
      - "tools/relay_container_ring_transition_release_contract.mjs"
      - "tests/relay-container-ring-transition-release*.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-transition-runner-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receipt-filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Record Linux and Rust identities
        run: |
          uname -a
          rustc -Vv
          cargo -V

      - name: Verify runner formatting
        run: cargo fmt --all -- --check

      - name: Verify Linux receipt filesystem behavior
        shell: bash
        run: |
          set -o pipefail
          trace_artifact_dir="${RUNNER_TEMP}/ring-transition-syscall-traces"
          mkdir -p "${trace_artifact_dir}"
          log_file="${trace_artifact_dir}/linux-library-tests.log"
          if cargo test --locked -p cinatoken-ring-transition-runner --lib 2>&1 | tee "${log_file}"; then
            exit 0
          fi
          focused_log="${trace_artifact_dir}/linux-multiprocess-terminal-recovery.log"
          set +e
          RUST_BACKTRACE=1 cargo test --locked -p cinatoken-ring-transition-runner \
            --lib \
            receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
            -- \
            --exact \
            --nocapture \
            2>&1 | tee "${focused_log}"
          focused_status="${PIPESTATUS[0]}"
          set -e
          {
            echo "### Linux receipt test failure"
            echo
            echo "- focused replay status: ${focused_status}"
            echo
            echo "#### Full library suite tail"
            echo '```text'
            tail -n 200 "${log_file}"
            echo '```'
            echo
            echo "#### Focused multiprocess replay tail"
            echo '```text'
            tail -n 200 "${focused_log}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          diagnostic="$(
            {
              echo "full library suite:"
              tail -n 160 "${log_file}"
              echo
              echo "focused multiprocess replay (status ${focused_status}):"
              tail -n 80 "${focused_log}"
            }
          )"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Linux receipt test failure::${diagnostic}"
          exit 1

      - name: Trace terminal transaction descriptor syscalls
        shell: bash
        run: |
          set -euo pipefail
          command -v strace
          strace_version="$(strace --version | head -n 1)"
          artifact_log="$(mktemp)"
          trace_artifact_dir="${RUNNER_TEMP}/ring-transition-syscall-traces"
          mkdir -p "${trace_artifact_dir}"
          trace_step_log="${trace_artifact_dir}/trace-step.log"
          exec > >(tee "${trace_step_log}") 2>&1
          trace_log="${trace_artifact_dir}/terminal-recovery.strace"
          trace_root="$(mktemp -d)"
          prepare_ready="${trace_root}.prepared"
          recover_ready="${trace_root}.recovered"
          full_trace_log="${trace_artifact_dir}/full-terminal-transaction.strace"
          full_trace_root="$(mktemp -d)"
          full_trace_ready="${full_trace_root}.ready"
          candidate_writer_trace_log="${trace_artifact_dir}/candidate-after-sync-writer.strace"
          candidate_recovery_trace_log="${trace_artifact_dir}/candidate-after-sync-recovery.strace"
          candidate_trace_root="$(mktemp -d)"
          candidate_writer_pid_file="${candidate_trace_root}.pid"
          candidate_writer_output="${trace_artifact_dir}/candidate-after-sync-writer.log"
          candidate_recovery_output="${trace_artifact_dir}/candidate-after-sync-recovery.log"
          concurrent_trace_parent="$(mktemp -d)"
          concurrent_trace_root="${concurrent_trace_parent}/fixture"
          mkdir -p "${concurrent_trace_root}"
          concurrent_fixture_ready="${concurrent_trace_root}.candidate-fixture-ready"
          concurrent_first_ready="${concurrent_trace_root}.concurrent-first.ready"
          concurrent_second_ready="${concurrent_trace_root}.concurrent-second.ready"
          concurrent_start_gate="${concurrent_trace_root}.concurrent-start.gate"
          concurrent_first_trace_log="${trace_artifact_dir}/candidate-concurrent-recovery-first.strace"
          concurrent_second_trace_log="${trace_artifact_dir}/candidate-concurrent-recovery-second.strace"
          concurrent_first_output="${trace_artifact_dir}/candidate-concurrent-recovery-first.log"
          concurrent_second_output="${trace_artifact_dir}/candidate-concurrent-recovery-second.log"
          concurrent_first_pid_file="${trace_artifact_dir}/candidate-concurrent-recovery-first.pid"
          concurrent_second_pid_file="${trace_artifact_dir}/candidate-concurrent-recovery-second.pid"
          startup_trace_log="${trace_artifact_dir}/concurrent-startup-recovery.strace"
          startup_output="${trace_artifact_dir}/concurrent-startup-recovery.log"
          startup_timeout_trace_log="${trace_artifact_dir}/startup-lock-timeout.strace"
          startup_timeout_output="${trace_artifact_dir}/startup-lock-timeout.log"
          startup_soak_output="${trace_artifact_dir}/startup-schedule-soak.log"
          startup_soak_records="${trace_artifact_dir}/startup-schedule-soak-records.ndjson"
          startup_trace_filter="%file,%network,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl"
          candidate_writer_tracer_pid=""
          candidate_writer_pid=""
          concurrent_first_tracer_pid=""
          concurrent_second_tracer_pid=""
          concurrent_first_pid=""
          concurrent_second_pid=""
          cleanup_trace_fixture() {
            local trace_status="$?"
            if [[ "${trace_status}" -ne 0 ]] && [[ -f "${trace_step_log}" ]]; then
              local diagnostic
              diagnostic="$(tail -n 120 "${trace_step_log}")"
              diagnostic="${diagnostic//'%'/'%25'}"
              diagnostic="${diagnostic//$'\r'/'%0D'}"
              diagnostic="${diagnostic//$'\n'/'%0A'}"
              echo "::error title=Terminal syscall trace failure::${diagnostic}"
            fi
            if [[ -n "${candidate_writer_pid}" ]]; then
              kill -KILL "${candidate_writer_pid}" 2>/dev/null || true
            fi
            if [[ -n "${candidate_writer_tracer_pid}" ]]; then
              kill -KILL "${candidate_writer_tracer_pid}" 2>/dev/null || true
            fi
            if [[ -n "${concurrent_first_pid}" ]]; then
              kill -KILL "${concurrent_first_pid}" 2>/dev/null || true
            fi
            if [[ -n "${concurrent_second_pid}" ]]; then
              kill -KILL "${concurrent_second_pid}" 2>/dev/null || true
            fi
            if [[ -n "${concurrent_first_tracer_pid}" ]]; then
              kill -KILL "${concurrent_first_tracer_pid}" 2>/dev/null || true
            fi
            if [[ -n "${concurrent_second_tracer_pid}" ]]; then
              kill -KILL "${concurrent_second_tracer_pid}" 2>/dev/null || true
            fi
            chmod -R u+w "${trace_root}" 2>/dev/null || true
            chmod -R u+w "${full_trace_root}" 2>/dev/null || true
            chmod -R u+w "${candidate_trace_root}" 2>/dev/null || true
            chmod -R u+w "${concurrent_trace_parent}" 2>/dev/null || true
            rm -rf \
              "${trace_root}" \
              "${prepare_ready}" \
              "${recover_ready}" \
              "${full_trace_root}" \
              "${full_trace_ready}" \
              "${candidate_trace_root}" \
              "${candidate_writer_pid_file}" \
              "${concurrent_trace_parent}" \
              "${artifact_log}"
            return "${trace_status}"
          }
          trap cleanup_trace_fixture EXIT

          cargo test --locked -p cinatoken-ring-transition-runner --lib --no-run \
            --message-format=json > "${artifact_log}"
          test_binary="$(
            python3 - "${artifact_log}" <<'PY'
          import json
          import sys

          candidates = []
          with open(sys.argv[1], "r", encoding="utf-8") as handle:
              for line in handle:
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  target = record.get("target", {})
                  if (
                      record.get("reason") == "compiler-artifact"
                      and record.get("executable")
                      and target.get("name") == "cinatoken_ring_transition_runner"
                      and "lib" in target.get("kind", [])
                      and record.get("profile", {}).get("test") is True
                  ):
                      candidates.append(record["executable"])
          if len(candidates) != 1:
              raise SystemExit(f"expected one runner library test binary, found {candidates!r}")
          print(candidates[0])
          PY
          )"

          env \
            CINATOKEN_RING_RECEIPT_TEST_ROLE=head-set-prepare \
            CINATOKEN_RING_RECEIPT_TEST_ROOT="${trace_root}" \
            CINATOKEN_RING_RECEIPT_TEST_READY="${prepare_ready}" \
            "${test_binary}" \
            --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
            --nocapture
          test "$(cat "${prepare_ready}")" = "head-set-synced"

          strace -f -qq -yy -s 4096 \
            -e trace=%file,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${trace_log}" \
            env \
              CINATOKEN_RING_RECEIPT_TEST_ROLE=recover-head-set \
              CINATOKEN_RING_RECEIPT_TEST_ROOT="${trace_root}" \
              CINATOKEN_RING_RECEIPT_TEST_READY="${recover_ready}" \
              "${test_binary}" \
              --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
              --nocapture

          strace -f -qq -yy -s 4096 \
            -e trace=%file,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${full_trace_log}" \
            env \
              CINATOKEN_RING_RECEIPT_TEST_ROLE=full-terminal-transaction \
              CINATOKEN_RING_RECEIPT_TEST_ROOT="${full_trace_root}" \
              CINATOKEN_RING_RECEIPT_TEST_READY="${full_trace_ready}" \
              "${test_binary}" \
              --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
              --nocapture

          strace -f -q -yy -s 4096 \
            -e trace=%file,flock,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${candidate_writer_trace_log}" \
            bash -c '
              printf "%s\n" "$$" > "$1"
              exec env \
                CINATOKEN_RING_RECEIPT_TEST_ROLE=candidate-synced-wait \
                CINATOKEN_RING_RECEIPT_TEST_ROOT="$2" \
                CINATOKEN_RING_RECEIPT_TEST_READY="${2}.unused" \
                CINATOKEN_RING_RECEIPT_TEST_READY_STDOUT=1 \
                "$3" \
                --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
                --nocapture
            ' _ "${candidate_writer_pid_file}" "${candidate_trace_root}" "${test_binary}" \
            > "${candidate_writer_output}" 2>&1 &
          candidate_writer_tracer_pid="$!"
          for _ in $(seq 1 1000); do
            if [[ -s "${candidate_writer_pid_file}" ]] &&
              grep -qx "candidate-synced" "${candidate_writer_output}"; then
              break
            fi
            if ! kill -0 "${candidate_writer_tracer_pid}" 2>/dev/null; then
              cat "${candidate_writer_output}"
              wait "${candidate_writer_tracer_pid}"
              exit 1
            fi
            sleep 0.01
          done
          test -s "${candidate_writer_pid_file}"
          grep -qx "candidate-synced" "${candidate_writer_output}"
          candidate_writer_pid="$(cat "${candidate_writer_pid_file}")"
          kill -KILL "${candidate_writer_pid}"
          set +e
          wait "${candidate_writer_tracer_pid}"
          candidate_writer_status="$?"
          set -e
          candidate_writer_tracer_pid=""
          candidate_writer_pid=""
          test "${candidate_writer_status}" -ne 0

          strace -f -qq -yy -s 4096 \
            -e trace=%file,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${candidate_recovery_trace_log}" \
            env \
              CINATOKEN_RING_RECEIPT_TEST_ROLE=recover-terminal-candidate \
              CINATOKEN_RING_RECEIPT_TEST_ROOT="${candidate_trace_root}" \
              CINATOKEN_RING_RECEIPT_TEST_READY="${candidate_trace_root}.unused" \
              "${test_binary}" \
              --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
              --nocapture \
            2>&1 | tee "${candidate_recovery_output}"

          env \
            CINATOKEN_RING_RECEIPT_TEST_ROLE=candidate-synced-prepare \
            CINATOKEN_RING_RECEIPT_TEST_ROOT="${concurrent_trace_root}" \
            CINATOKEN_RING_RECEIPT_TEST_READY="${concurrent_fixture_ready}" \
            "${test_binary}" \
            --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
            --nocapture
          test "$(cat "${concurrent_fixture_ready}")" = "candidate-synced"

          strace -f -qq -yy -s 4096 \
            -e trace=%file,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${concurrent_first_trace_log}" \
            bash -c '
              printf "%s\n" "$$" > "$1"
              exec env \
                CINATOKEN_RING_RECEIPT_TEST_ROLE=recover-terminal-candidate-concurrent-worker \
                CINATOKEN_RING_RECEIPT_TEST_ROOT="$2" \
                CINATOKEN_RING_RECEIPT_TEST_READY="$3" \
                "$4" \
                --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
                --nocapture
            ' _ \
              "${concurrent_first_pid_file}" \
              "${concurrent_trace_root}" \
              "${concurrent_first_ready}" \
              "${test_binary}" \
            > "${concurrent_first_output}" 2>&1 &
          concurrent_first_tracer_pid="$!"

          strace -f -qq -yy -s 4096 \
            -e trace=%file,flock,clock_nanosleep,fsync,fdatasync,fchmod,close,dup,dup2,dup3,fcntl \
            -o "${concurrent_second_trace_log}" \
            bash -c '
              printf "%s\n" "$$" > "$1"
              exec env \
                CINATOKEN_RING_RECEIPT_TEST_ROLE=recover-terminal-candidate-concurrent-worker \
                CINATOKEN_RING_RECEIPT_TEST_ROOT="$2" \
                CINATOKEN_RING_RECEIPT_TEST_READY="$3" \
                "$4" \
                --exact receipt::tests::linux_multiprocess_terminal_rename_and_kill_recovery \
                --nocapture
            ' _ \
              "${concurrent_second_pid_file}" \
              "${concurrent_trace_root}" \
              "${concurrent_second_ready}" \
              "${test_binary}" \
            > "${concurrent_second_output}" 2>&1 &
          concurrent_second_tracer_pid="$!"

          for _ in $(seq 1 1000); do
            if [[ -s "${concurrent_first_ready}" ]] &&
              [[ -s "${concurrent_second_ready}" ]] &&
              [[ -s "${concurrent_first_pid_file}" ]] &&
              [[ -s "${concurrent_second_pid_file}" ]]; then
              break
            fi
            if ! kill -0 "${concurrent_first_tracer_pid}" 2>/dev/null ||
              ! kill -0 "${concurrent_second_tracer_pid}" 2>/dev/null; then
              cat "${concurrent_first_output}"
              cat "${concurrent_second_output}"
              exit 1
            fi
            sleep 0.01
          done
          test "$(cat "${concurrent_first_ready}")" = "recovery-ready"
          test "$(cat "${concurrent_second_ready}")" = "recovery-ready"
          concurrent_first_pid="$(cat "${concurrent_first_pid_file}")"
          concurrent_second_pid="$(cat "${concurrent_second_pid_file}")"
          test "${concurrent_first_pid}" != "${concurrent_second_pid}"
          kill -0 "${concurrent_first_pid}"
          kill -0 "${concurrent_second_pid}"
          printf "recover" > "${concurrent_start_gate}.staging"
          mv "${concurrent_start_gate}.staging" "${concurrent_start_gate}"

          set +e
          wait "${concurrent_first_tracer_pid}"
          concurrent_first_status="$?"
          wait "${concurrent_second_tracer_pid}"
          concurrent_second_status="$?"
          set -e
          concurrent_first_tracer_pid=""
          concurrent_second_tracer_pid=""
          concurrent_first_pid=""
          concurrent_second_pid=""
          if [[ "${concurrent_first_status}" -ne 0 ]] ||
            [[ "${concurrent_second_status}" -ne 0 ]]; then
            cat "${concurrent_first_output}"
            cat "${concurrent_second_output}"
            exit 1
          fi
          concurrent_first_closure="$(
            grep '^concurrent-terminal-closure=' "${concurrent_first_output}" | tail -n 1
          )"
          concurrent_second_closure="$(
            grep '^concurrent-terminal-closure=' "${concurrent_second_output}" | tail -n 1
          )"
          concurrent_first_unfinished="$(
            grep '^concurrent-recovery-unfinished=' "${concurrent_first_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          concurrent_second_unfinished="$(
            grep '^concurrent-recovery-unfinished=' "${concurrent_second_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          concurrent_first_lock_tid="$(
            grep '^concurrent-lock-thread-id=' "${concurrent_first_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          concurrent_second_lock_tid="$(
            grep '^concurrent-lock-thread-id=' "${concurrent_second_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          test -n "${concurrent_first_closure}"
          test "${concurrent_first_closure}" = "${concurrent_second_closure}"
          [[ "${concurrent_first_lock_tid}" =~ ^[1-9][0-9]*$ ]]
          [[ "${concurrent_second_lock_tid}" =~ ^[1-9][0-9]*$ ]]
          test "${concurrent_first_lock_tid}" != "${concurrent_second_lock_tid}"
          case "${concurrent_first_unfinished}:${concurrent_second_unfinished}" in
            1:0|0:1) ;;
            *)
              cat "${concurrent_first_output}"
              cat "${concurrent_second_output}"
              exit 1
              ;;
          esac

          node tools/verify_ring_transition_runner_syscall_trace.mjs \
            --trace "${trace_log}" \
            --fixture-root "${trace_root}" \
            --label "terminal recovery" \
            --expected-locks 4 \
            | tee "${trace_artifact_dir}/terminal-recovery.verification.json"
          node tools/verify_ring_transition_runner_syscall_trace.mjs \
            --trace "${full_trace_log}" \
            --fixture-root "${full_trace_root}" \
            --label "full terminal transaction" \
            --expected-locks 10 \
            --require-mkdirat \
            | tee "${trace_artifact_dir}/full-terminal-transaction.verification.json"
          node tools/verify_ring_transition_runner_syscall_trace.mjs \
            --trace "${candidate_writer_trace_log}" \
            --fixture-root "${candidate_trace_root}" \
            --label "candidate-after-sync writer" \
            --expected-locks 4 \
            --require-mkdirat \
            --require-sigkill-exit \
            --require-terminal-candidate-sync \
            | tee "${trace_artifact_dir}/candidate-after-sync-writer.verification.json"
          node tools/verify_ring_transition_runner_syscall_trace.mjs \
            --trace "${candidate_recovery_trace_log}" \
            --fixture-root "${candidate_trace_root}" \
            --label "candidate-after-sync recovery" \
            --expected-locks 8 \
            --require-mkdirat \
            | tee "${trace_artifact_dir}/candidate-after-sync-recovery.verification.json"
          node tools/verify_ring_transition_runner_syscall_trace.mjs \
            --trace "${concurrent_first_trace_log}" \
            --peer-trace "${concurrent_second_trace_log}" \
            --fixture-root "${concurrent_trace_root}" \
            --label "concurrent candidate recovery" \
            --expected-locks 12 \
            --expected-lock-pids 2 \
            --expected-locks-per-pid 6 \
            --require-mkdirat \
            | tee "${trace_artifact_dir}/candidate-concurrent-recovery.verification.json"
          expected_concurrent_lock_tids="$(
            jq -cn \
              --arg firstLockTid "${concurrent_first_lock_tid}" \
              --arg secondLockTid "${concurrent_second_lock_tid}" \
              '[$firstLockTid, $secondLockTid] | sort'
          )"
          observed_concurrent_lock_tids="$(
            jq -c \
              '.observedLockPidValues | sort' \
              "${trace_artifact_dir}/candidate-concurrent-recovery.verification.json"
          )"
          printf "concurrent-expected-lock-tids=%s\n" "${expected_concurrent_lock_tids}"
          printf "concurrent-observed-lock-tids=%s\n" "${observed_concurrent_lock_tids}"
          test "${observed_concurrent_lock_tids}" = "${expected_concurrent_lock_tids}"
          echo "concurrent-lock-thread-identity=verified"

          jq -n \
            --arg gitSha "${GITHUB_SHA}" \
            --arg boundary "candidate-after-sync-before-accepted-finish" \
            --arg signal "SIGKILL" \
            --argjson tracerStatus "${candidate_writer_status}" \
            --argjson writerExpectedLocks 4 \
            --argjson recoveryExpectedLocks 8 \
            '{
              gitSha: $gitSha,
              boundary: $boundary,
              signal: $signal,
              tracerStatus: $tracerStatus,
              writerExpectedLocks: $writerExpectedLocks,
              recoveryExpectedLocks: $recoveryExpectedLocks
            }' > "${trace_artifact_dir}/candidate-after-sync-boundary.json"

          jq -n \
            --arg gitSha "${GITHUB_SHA}" \
            --arg firstProcessPid "$(cat "${concurrent_first_pid_file}")" \
            --arg secondProcessPid "$(cat "${concurrent_second_pid_file}")" \
            --arg firstLockThreadId "${concurrent_first_lock_tid}" \
            --arg secondLockThreadId "${concurrent_second_lock_tid}" \
            --arg closure "${concurrent_first_closure#concurrent-terminal-closure=}" \
            --argjson firstStatus "${concurrent_first_status}" \
            --argjson secondStatus "${concurrent_second_status}" \
            --argjson firstUnfinished "${concurrent_first_unfinished}" \
            --argjson secondUnfinished "${concurrent_second_unfinished}" \
            '{
              gitSha: $gitSha,
              participants: [
                {
                  name: "first",
                  processPid: $firstProcessPid,
                  lockThreadId: $firstLockThreadId,
                  tracerStatus: $firstStatus,
                  unfinishedObserved: $firstUnfinished
                },
                {
                  name: "second",
                  processPid: $secondProcessPid,
                  lockThreadId: $secondLockThreadId,
                  tracerStatus: $secondStatus,
                  unfinishedObserved: $secondUnfinished
                }
              ],
              sharedStartGate: true,
              exactlyOneRecoveryWriter: (
                ($firstUnfinished + $secondUnfinished) == 1
              ),
              closureIdentity: $closure
            }' > "${trace_artifact_dir}/candidate-concurrent-recovery-boundary.json"
          jq -e \
            '.exactlyOneRecoveryWriter == true and (.closureIdentity | length > 0)' \
            "${trace_artifact_dir}/candidate-concurrent-recovery-boundary.json" \
            > /dev/null
          echo "concurrent-boundary-manifest=verified"

          strace -f -qq -yy -s 4096 \
            -e "trace=${startup_trace_filter}" \
            -o "${startup_trace_log}" \
            "${test_binary}" \
            --exact transport::tests::linux_multiprocess_startup_terminal_candidate_converges_without_http \
            --nocapture \
            2>&1 | tee "${startup_output}"
          startup_process_ids="$(
            grep '^startup-pair-process-ids=' "${startup_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          startup_lock_thread_ids="$(
            grep '^startup-pair-lock-thread-ids=' "${startup_output}" |
              tail -n 1 |
              cut -d= -f2
          )"
          startup_trace_start_paths="$(
            grep '^startup-pair-trace-start-paths=' "${startup_output}" |
              tail -n 1 |
              cut -d= -f2-
          )"
          startup_trace_finish_paths="$(
            grep '^startup-pair-trace-finish-paths=' "${startup_output}" |
              tail -n 1 |
              cut -d= -f2-
          )"
          startup_closure="$(
            grep '^startup-pair-closure=' "${startup_output}" |
              tail -n 1 |
