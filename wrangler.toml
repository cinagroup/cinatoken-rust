# Workers for Platforms dispatch namespace. Create the namespace first, then
# uncomment in the environment that should accept tenant/preview traffic:
#   wrangler dispatch-namespace create cinatoken-rust-tenants
# [[dispatch_namespaces]]
# binding = "DISPATCHER"
# namespace = "cinatoken-rust-tenants"
# [dispatch_namespaces.outbound]
# service = "cinatoken-wfp-outbound"
# parameters = ["CINATOKEN_WFP_OUTBOUND_CONTEXT"]

[[d1_databases]]
binding = "DB"
database_name = "cinatoken-rust-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations/d1"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "00000000000000000000000000000000"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000000"

[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "cinatoken-rust-files"

[[queues.producers]]
queue = "cinatoken-rust-log-events"
binding = "LOG_QUEUE"

[[queues.producers]]
queue = "cinatoken-rust-task-events"
binding = "TASK_QUEUE"

[[queues.producers]]
queue = "cinatoken-rust-billing-finalization"
binding = "BILLING_QUEUE"

# LOG_QUEUE consumer: drains relay audit events in batches of up to 100
# messages or every 5 seconds (whichever comes first), then bulk-INSERTs
# them into D1 in a single round-trip. Failed batches retry up to 3 times
# before landing in the dead-letter queue for manual inspection.
# Create the DLQ before first deploy:
#   wrangler queues create cinatoken-rust-log-events-dlq
[[queues.consumers]]
queue = "cinatoken-rust-log-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "cinatoken-rust-log-events-dlq"

[[queues.consumers]]
queue = "cinatoken-rust-billing-finalization"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 10
dead_letter_queue = "cinatoken-rust-billing-finalization-dlq"

[[queues.consumers]]
queue = "cinatoken-rust-billing-finalization-dlq"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 10
dead_letter_queue = "cinatoken-rust-billing-finalization-parking"

# Channel-affinity (sticky-routing) Durable Object. Inert at runtime unless
# RELAY_CHANNEL_AFFINITY_ENABLED is set, so deploying the binding alone changes
# nothing. SQLite-backed (requires the compatibility_date above).
[[durable_objects.bindings]]
name = "CHANNEL_AFFINITY"
class_name = "ChannelAffinity"

[[durable_objects.bindings]]
name = "REALTIME_SESSIONS"
class_name = "RealtimeSession"

[[durable_objects.bindings]]
name = "TASK_RUNNER"
class_name = "TaskRunner"

[[durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"

[[durable_objects.bindings]]
name = "PASSKEY_CEREMONIES"
class_name = "PasskeyCeremony"

[[durable_objects.bindings]]
name = "QUOTA_COORD"
class_name = "QuotaCoordinator"

[[migrations]]
tag = "v1-channel-affinity"
new_sqlite_classes = ["ChannelAffinity"]

[[migrations]]
tag = "v2-realtime-session"
new_sqlite_classes = ["RealtimeSession"]

[[migrations]]
tag = "v3-task-runner"
new_sqlite_classes = ["TaskRunner"]

[[migrations]]
tag = "v4-wfp-authority-replay"
new_sqlite_classes = ["WfpAuthorityReplay"]

[[migrations]]
tag = "v5-passkey-ceremony"
new_sqlite_classes = ["PasskeyCeremony"]

[[migrations]]
tag = "v6-quota-coordinator"
new_sqlite_classes = ["QuotaCoordinator"]

