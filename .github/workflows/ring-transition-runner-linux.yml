                "single-captured-sample-plus-process-soak-v1" and
              (.traceEvidence.traceSha256 | test("^[0-9a-f]{64}$"))' \
            "${trace_artifact_dir}/startup-schedule-soak-boundary.json" \
            > /dev/null
          echo "startup-schedule-soak-boundary=verified"

          {
            echo "### Terminal descriptor syscall traces"
            echo
            echo "- recovery post-lock AT_FDCWD mutation: none"
            echo "- full-transaction post-lock AT_FDCWD mutation: none"
            echo "- candidate writer: exact SIGKILL after candidate rename/directory sync/object-bound readback"
            echo "- candidate-after-sync recovery post-lock AT_FDCWD mutation: none"
            echo "- concurrent candidate recovery: two distinct ready-before-release processes converged on one closure identity"
            echo "- concurrent verify_loaded_credentials startup: two distinct current-thread Tokio TIDs converged on ReceiptSealed with zero network syscalls inside their create-new marker windows"
            echo "- blocked verify_loaded_credentials startup: typed 5s receipts-root LockTimeout, zero scoped successful locks/network syscalls/HTTP exchange construction, unchanged receipt tree, safe ReceiptSealed recovery after release"
            echo "- startup schedule campaign: 32 independent dual-process iterations converged on one ReceiptSealed closure within 15s per iteration and 120s total; one separate sample carries the syscall trace proof"
            echo "- exact successful paired nonblocking exclusive locks: recovery 4; full transaction 10; candidate writer 4; candidate recovery 8; concurrent recovery 6 per PID / 12 total"
            echo "- lock contention: one shared 5s CLOCK_MONOTONIC deadline per receipts/authorization pair with absolute retry sleeps and zero blocking flock attempts"
            echo "- successful retained-dirfd openat2/renameat2: observed in each standalone trace or the concurrent bundle"
            echo "- successful full-transaction and candidate-recovery retained-dirfd mkdirat: observed"
            echo "- successful directory fsync/fdatasync and descriptor chmod: observed in each standalone trace or the concurrent bundle"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain syscall verification summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring-transition-syscall-summaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ring-transition-syscall-traces/*.verification.json
            ${{ runner.temp }}/ring-transition-syscall-traces/*-boundary.json
            ${{ runner.temp }}/ring-transition-syscall-traces/*.ndjson
            ${{ runner.temp }}/ring-transition-syscall-traces/*.log
            ${{ runner.temp }}/ring-transition-syscall-traces/*.pid
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain successful syscall traces
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring-transition-successful-syscall-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ring-transition-syscall-traces/*.strace
          if-no-files-found: error
          retention-days: 30

      - name: Retain failed syscall traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ring-transition-syscall-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ring-transition-syscall-traces
          if-no-files-found: ignore
          retention-days: 7

      - name: Reject runner warnings
        shell: bash
        run: |
          set -o pipefail
          log_file="$(mktemp)"
          if cargo clippy --locked -p cinatoken-ring-transition-runner --all-targets -- -D warnings 2>&1 | tee "${log_file}"; then
            exit 0
          fi
          diagnostic="$(tail -n 80 "${log_file}")"
          diagnostic="${diagnostic//'%'/'%25'}"
          diagnostic="${diagnostic//$'\r'/'%0D'}"
          diagnostic="${diagnostic//$'\n'/'%0A'}"
          echo "::error title=Linux runner clippy failure::${diagnostic}"
          exit 1
