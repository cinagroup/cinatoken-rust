[workspace]
members = [
  "crates/api",
  "crates/auth",
  "crates/billing",
  "crates/cache",
  "crates/core",
  "crates/migration",
  "crates/observability",
  "crates/payments",
  "crates/providers",
  "crates/relay",
  "crates/storage",
  "crates/tasks",
  "crates/worker",
  "crates/xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/cinagroup/cinatoken-rust"
rust-version = "1.78"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
worker = "0.5"
