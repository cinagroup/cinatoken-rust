name: container-runtime-oci

on:
  pull_request:
    paths:
      - ".github/workflows/container-runtime-oci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "tools/verify_container_runtime_oci.mjs"
      - "tools/verify_container_runtime_sbom.mjs"
      - "tools/verify_container_runtime_vulnerabilities.mjs"
      - "tests/container-runtime-oci-gate.test.mjs"
      - "tests/container-runtime-sbom-gate.test.mjs"
      - "tests/container-runtime-vulnerability-gate.test.mjs"
      - "tests/fixtures/container-runtime-oci/**"
      - "tests/fixtures/container-runtime-vulnerability/**"
      - "config/container-runtime-vulnerability-db.json"
      - "config/container-runtime-vulnerability-db-listing.json"
      - "config/container-runtime-vulnerability-policy.json"
      - "config/container-runtime-vulnerability-approvals.json"
      - "package.json"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-runtime-oci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/container-runtime/**"
      - "tools/verify_container_runtime_oci.mjs"
      - "tools/verify_container_runtime_sbom.mjs"
      - "tools/verify_container_runtime_vulnerabilities.mjs"
      - "tests/container-runtime-oci-gate.test.mjs"
      - "tests/container-runtime-sbom-gate.test.mjs"
      - "tests/container-runtime-vulnerability-gate.test.mjs"
      - "tests/fixtures/container-runtime-oci/**"
      - "tests/fixtures/container-runtime-vulnerability/**"
      - "config/container-runtime-vulnerability-db.json"
      - "config/container-runtime-vulnerability-db-listing.json"
      - "config/container-runtime-vulnerability-policy.json"
      - "config/container-runtime-vulnerability-approvals.json"
      - "package.json"
      - "docs/migration-completion-status.md"
      - "docs/verification.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-runtime-oci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducible-linux-amd64-oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILDX_BUILDER_A: cinatoken-oci-a-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDX_BUILDER_B: cinatoken-oci-b-${{ github.run_id }}-${{ github.run_attempt }}
      BUILDKIT_IMAGE: moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
      SYFT_IMAGE: ghcr.io/anchore/syft:v1.49.0@sha256:13b53ebabe3d215268c90cf8fb9b875f0183908245f376fd4b3a2cb69d21d484
      GRYPE_IMAGE: ghcr.io/anchore/grype:v0.116.0@sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821
      GRYPE_IMAGE_INDEX_DIGEST: sha256:fd4ab4d1042b522c896e73bdf09ab8bf384fa417df99d6dd0d6e1008c7e7c821
      GRYPE_IMAGE_AMD64_MANIFEST_DIGEST: sha256:3d08845e24eba657b8ea9bd28344a5a4e9dcd772818062a6522bf30137928616
      GRYPE_DB_ARCHIVE_URL: https://grype.anchore.io/databases/v6/vulnerability-db_v6.1.9_2026-07-26T00:41:33Z_1785049634.tar.zst
      GRYPE_DB_ARCHIVE_SHA256: 766bec0ec8f8f0a475b1cd2dfd8f2f6a2883346963600816ce89f323c96c70bc
      GRYPE_DB_FILE_SHA256: 55279915a94b36f1307f5104a66d2e6980f52f34a9c67f09c4413a46d7db9253
      GRYPE_DB_FILE_BYTES: "1957412864"
      GRYPE_DB_IMPORT_SHA256: 39b5d45042076f5071f77d7bea95ec8dac45f37fca84f69657d43afb679dea4f
      GRYPE_DB_IMPORT_BYTES: "97"
      GRYPE_DB_SCHEMA_VERSION: v6.1.9
      GRYPE_DB_BUILT: "2026-07-26T07:07:14Z"
      EVIDENCE_DIR: /tmp/container-runtime-oci
      OCI_ARCHIVE_A: /tmp/container-runtime-oci/container-runtime-a.tar
      OCI_ARCHIVE_B: /tmp/container-runtime-oci/container-runtime-b.tar
    steps:
      - name: Check out frozen source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Create pinned BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          for builder in "${BUILDX_BUILDER_A}" "${BUILDX_BUILDER_B}"; do
            docker buildx create \
              --name "${builder}" \
              --driver docker-container \
              --driver-opt "image=${BUILDKIT_IMAGE}"
          done
          docker buildx inspect "${BUILDX_BUILDER_A}" --bootstrap \
            | tee "${EVIDENCE_DIR}/builder-a-info.log"
          docker buildx inspect "${BUILDX_BUILDER_B}" --bootstrap \
            | tee "${EVIDENCE_DIR}/builder-b-info.log"
          docker buildx version | tee "${EVIDENCE_DIR}/buildx-version.log"
          docker version | tee "${EVIDENCE_DIR}/docker-version.log"

      - name: Build two independent OCI archives
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "${BUILDX_BUILDER_A}" \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --provenance=false \
            --sbom=false \
            --file crates/container-runtime/Dockerfile \
            --output "type=oci,dest=${OCI_ARCHIVE_A},rewrite-timestamp=true,compression=gzip,compression-level=9,force-compression=true,oci-mediatypes=true,compatibility-version=20" \
            .
          docker buildx build \
            --builder "${BUILDX_BUILDER_B}" \
            --no-cache \
            --platform linux/amd64 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --provenance=false \
            --sbom=false \
            --file crates/container-runtime/Dockerfile \
            --output "type=oci,dest=${OCI_ARCHIVE_B},rewrite-timestamp=true,compression=gzip,compression-level=9,force-compression=true,oci-mediatypes=true,compatibility-version=20" \
            .

      - name: Verify OCI archive reproducibility
        shell: bash
        run: |
          set -o pipefail
          node tools/verify_container_runtime_oci.mjs \
            --archive-a "${OCI_ARCHIVE_A}" \
            --archive-b "${OCI_ARCHIVE_B}" \
            --json \
            2> >(tee "${EVIDENCE_DIR}/container-runtime-oci-verification.log" >&2) \
            | tee "${EVIDENCE_DIR}/container-runtime-oci-verification.json"

      - name: Generate and verify deterministic SBOM
        shell: bash
        run: |
          set -euo pipefail
          OCI_REPORT="${EVIDENCE_DIR}/container-runtime-oci-verification.json"
          OCI_MANIFEST_DIGEST="$(
            node -e '
              const fs = require("node:fs");
              const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!/^sha256:[a-f0-9]{64}$/.test(report.ociManifestDigest ?? "")) {
                throw new Error("OCI report manifest digest is invalid");
              }
              process.stdout.write(report.ociManifestDigest);
            ' "${OCI_REPORT}"
          )"
          docker pull --platform linux/amd64 "${SYFT_IMAGE}" \
            | tee "${EVIDENCE_DIR}/syft-pull.log"
          docker image inspect "${SYFT_IMAGE}" \
            > "${EVIDENCE_DIR}/syft-image-inspect.json"

          generate_sbom() {
            local archive="$1"
            local output_file="$2"
            mkdir -p "$(dirname "${output_file}")"
            : > "${output_file}"
            docker run --rm \
              --pull never \
              --platform linux/amd64 \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges=true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 256 \
              --memory 1g \
              --cpus 2 \
              --ulimit nofile=1024:1024 \
              --ulimit fsize=67108864:67108864 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777 \
              --env HOME=/tmp \
              --env XDG_CACHE_HOME=/tmp/cache \
              --env SYFT_CHECK_FOR_APP_UPDATE=false \
              --mount "type=bind,src=${archive},dst=/input/container-runtime.tar,readonly" \
              --mount "type=bind,src=${output_file},dst=/output/container-runtime.sbom.syft.json" \
              "${SYFT_IMAGE}" \
              "oci-archive:/input/container-runtime.tar" \
              --scope squashed \
              --source-name cinatoken-container-runtime \
              --source-version "${OCI_MANIFEST_DIGEST}" \
              --output syft-json=/output/container-runtime.sbom.syft.json
          }

          generate_sbom \
            "${OCI_ARCHIVE_A}" \
            "${EVIDENCE_DIR}/sbom-a/container-runtime.sbom.syft.json"
          generate_sbom \
            "${OCI_ARCHIVE_B}" \
            "${EVIDENCE_DIR}/sbom-b/container-runtime.sbom.syft.json"

          set -o pipefail
          node tools/verify_container_runtime_sbom.mjs \
            --sbom-a "${EVIDENCE_DIR}/sbom-a/container-runtime.sbom.syft.json" \
            --sbom-b "${EVIDENCE_DIR}/sbom-b/container-runtime.sbom.syft.json" \
            --oci-report "${OCI_REPORT}" \
            --json \
            2> >(tee "${EVIDENCE_DIR}/container-runtime-sbom-verification.log" >&2) \
            | tee "${EVIDENCE_DIR}/container-runtime-sbom-verification.json"

      - name: Generate and verify deterministic vulnerability decision
        shell: bash
        run: |
          set -euo pipefail
          GRYPE_DB_ARCHIVE="${EVIDENCE_DIR}/grype-db.tar.zst"
          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --output "${GRYPE_DB_ARCHIVE}" \
            "${GRYPE_DB_ARCHIVE_URL}"
          DATABASE_ARCHIVE_BYTES="$(stat --format=%s "${GRYPE_DB_ARCHIVE}")"
          if [[ "${DATABASE_ARCHIVE_BYTES}" -le 0 || "${DATABASE_ARCHIVE_BYTES}" -gt 536870912 ]]; then
            echo "Grype database archive size is outside the 512 MiB bound" >&2
            exit 1
          fi
          echo "${GRYPE_DB_ARCHIVE_SHA256}  ${GRYPE_DB_ARCHIVE}" | sha256sum --check --strict -

          docker pull --platform linux/amd64 "${GRYPE_IMAGE}" \
            | tee "${EVIDENCE_DIR}/grype-pull.log"
          docker buildx imagetools inspect --raw "${GRYPE_IMAGE}" \
            > "${EVIDENCE_DIR}/grype-image-index.json"
          docker image inspect "${GRYPE_IMAGE}" \
            > "${EVIDENCE_DIR}/grype-image-inspect.json"

          import_database() {
            local database_root="$1"
            mkdir -p "${database_root}"
            docker run --rm \
              --pull never \
              --platform linux/amd64 \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges=true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 256 \
              --memory 2g \
              --cpus 2 \
              --ulimit nofile=1024:1024 \
              --ulimit fsize=2147483648:2147483648 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777 \
              --env HOME=/tmp \
              --env XDG_CACHE_HOME=/tmp/cache \
              --env GRYPE_CHECK_FOR_APP_UPDATE=false \
              --env GRYPE_DB_AUTO_UPDATE=false \
              --env GRYPE_DB_VALIDATE_BY_HASH_ON_START=true \
              --env GRYPE_DB_VALIDATE_AGE=true \
              --env GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h \
              --env GRYPE_DB_REQUIRE_UPDATE_CHECK=false \
              --env GRYPE_DB_CACHE_DIR=/grype-db \
              --mount "type=bind,src=${GRYPE_DB_ARCHIVE},dst=/input/grype-db.tar.zst,readonly" \
              --mount "type=bind,src=${database_root},dst=/grype-db" \
              "${GRYPE_IMAGE}" \
              db import /input/grype-db.tar.zst
          }

          scan_sbom() {
            local database_root="$1"
            local sbom_file="$2"
            local status_file="$3"
            local output_file="$4"
            mkdir -p "$(dirname "${status_file}")" "$(dirname "${output_file}")"
            : > "${status_file}"
            : > "${output_file}"
            docker run --rm \
              --pull never \
              --platform linux/amd64 \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges=true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 256 \
              --memory 2g \
              --cpus 2 \
              --ulimit nofile=1024:1024 \
              --ulimit fsize=134217728:134217728 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777 \
              --env HOME=/tmp \
              --env XDG_CACHE_HOME=/tmp/cache \
              --env GRYPE_CHECK_FOR_APP_UPDATE=false \
              --env GRYPE_DB_AUTO_UPDATE=false \
              --env GRYPE_DB_VALIDATE_BY_HASH_ON_START=true \
              --env GRYPE_DB_VALIDATE_AGE=true \
              --env GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h \
              --env GRYPE_DB_REQUIRE_UPDATE_CHECK=false \
              --env GRYPE_DB_CACHE_DIR=/grype-db \
              --env GRYPE_TIMESTAMP=false \
              --mount "type=bind,src=${database_root},dst=/grype-db,readonly" \
              "${GRYPE_IMAGE}" \
              db status --output json \
              > "${status_file}"
            docker run --rm \
              --pull never \
              --platform linux/amd64 \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges=true \
              --user "$(id -u):$(id -g)" \
              --pids-limit 256 \
              --memory 2g \
              --cpus 2 \
              --ulimit nofile=1024:1024 \
              --ulimit fsize=134217728:134217728 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777 \
              --env HOME=/tmp \
              --env XDG_CACHE_HOME=/tmp/cache \
              --env GRYPE_CHECK_FOR_APP_UPDATE=false \
              --env GRYPE_DB_AUTO_UPDATE=false \
              --env GRYPE_DB_VALIDATE_BY_HASH_ON_START=true \
              --env GRYPE_DB_VALIDATE_AGE=true \
              --env GRYPE_DB_MAX_ALLOWED_BUILT_AGE=48h \
              --env GRYPE_DB_REQUIRE_UPDATE_CHECK=false \
              --env GRYPE_DB_CACHE_DIR=/grype-db \
              --env GRYPE_TIMESTAMP=false \
              --mount "type=bind,src=${database_root},dst=/grype-db,readonly" \
              --mount "type=bind,src=${sbom_file},dst=/input/container-runtime.sbom.syft.json,readonly" \
              --mount "type=bind,src=${output_file},dst=/output/container-runtime.vulnerabilities.grype.json" \
              "${GRYPE_IMAGE}" \
              "sbom:/input/container-runtime.sbom.syft.json" \
              --show-suppressed \
              --output json=/output/container-runtime.vulnerabilities.grype.json
          }

          fingerprint_scan_inputs() {
            local output_file="$1"
            local label input_file bytes digest
            : > "${output_file}"
            while IFS='|' read -r label input_file; do
              bytes="$(stat --format=%s "${input_file}")"
              digest="$(sha256sum "${input_file}" | cut -d ' ' -f 1)"
              printf '%s %s %s\n' "${label}" "${bytes}" "${digest}" \
                >> "${output_file}"
            done <<EOF
          sbom-a|${EVIDENCE_DIR}/sbom-a/container-runtime.sbom.syft.json
          sbom-b|${EVIDENCE_DIR}/sbom-b/container-runtime.sbom.syft.json
          db-a|${EVIDENCE_DIR}/grype-db-a/6/vulnerability.db
          db-b|${EVIDENCE_DIR}/grype-db-b/6/vulnerability.db
          import-a|${EVIDENCE_DIR}/grype-db-a/6/import.json
          import-b|${EVIDENCE_DIR}/grype-db-b/6/import.json
          EOF
          }

          import_database \
            "${EVIDENCE_DIR}/grype-db-a"
          import_database \
            "${EVIDENCE_DIR}/grype-db-b"
          fingerprint_scan_inputs \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt"
          grep --fixed-strings --line-regexp \
            "db-a ${GRYPE_DB_FILE_BYTES} ${GRYPE_DB_FILE_SHA256}" \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt"
          grep --fixed-strings --line-regexp \
            "db-b ${GRYPE_DB_FILE_BYTES} ${GRYPE_DB_FILE_SHA256}" \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt"
          grep --fixed-strings --line-regexp \
            "import-a ${GRYPE_DB_IMPORT_BYTES} ${GRYPE_DB_IMPORT_SHA256}" \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt"
          grep --fixed-strings --line-regexp \
            "import-b ${GRYPE_DB_IMPORT_BYTES} ${GRYPE_DB_IMPORT_SHA256}" \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt"
          scan_sbom \
            "${EVIDENCE_DIR}/grype-db-a" \
            "${EVIDENCE_DIR}/sbom-a/container-runtime.sbom.syft.json" \
            "${EVIDENCE_DIR}/grype-db-status-a.json" \
            "${EVIDENCE_DIR}/scan-a/container-runtime.vulnerabilities.grype.json"
          scan_sbom \
            "${EVIDENCE_DIR}/grype-db-b" \
            "${EVIDENCE_DIR}/sbom-b/container-runtime.sbom.syft.json" \
            "${EVIDENCE_DIR}/grype-db-status-b.json" \
            "${EVIDENCE_DIR}/scan-b/container-runtime.vulnerabilities.grype.json"
          fingerprint_scan_inputs \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-after.txt"
          cmp --silent \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt" \
            "${EVIDENCE_DIR}/vulnerability-scan-inputs-after.txt"

          set -o pipefail
          node tools/verify_container_runtime_vulnerabilities.mjs \
            --scan-a "${EVIDENCE_DIR}/scan-a/container-runtime.vulnerabilities.grype.json" \
            --scan-b "${EVIDENCE_DIR}/scan-b/container-runtime.vulnerabilities.grype.json" \
            --sbom-a "${EVIDENCE_DIR}/sbom-a/container-runtime.sbom.syft.json" \
            --sbom-b "${EVIDENCE_DIR}/sbom-b/container-runtime.sbom.syft.json" \
            --sbom-report "${EVIDENCE_DIR}/container-runtime-sbom-verification.json" \
            --db-status-a "${EVIDENCE_DIR}/grype-db-status-a.json" \
            --db-status-b "${EVIDENCE_DIR}/grype-db-status-b.json" \
            --db-archive "${GRYPE_DB_ARCHIVE}" \
            --db-file-a "${EVIDENCE_DIR}/grype-db-a/6/vulnerability.db" \
            --db-file-b "${EVIDENCE_DIR}/grype-db-b/6/vulnerability.db" \
            --db-import-a "${EVIDENCE_DIR}/grype-db-a/6/import.json" \
            --db-import-b "${EVIDENCE_DIR}/grype-db-b/6/import.json" \
            --db-metadata config/container-runtime-vulnerability-db.json \
            --db-listing config/container-runtime-vulnerability-db-listing.json \
            --policy config/container-runtime-vulnerability-policy.json \
            --approvals config/container-runtime-vulnerability-approvals.json \
            --scanner-index "${EVIDENCE_DIR}/grype-image-index.json" \
            --scanner-inspect "${EVIDENCE_DIR}/grype-image-inspect.json" \
            --input-snapshot-before "${EVIDENCE_DIR}/vulnerability-scan-inputs-before.txt" \
            --input-snapshot-after "${EVIDENCE_DIR}/vulnerability-scan-inputs-after.txt" \
            --observed-at "${OBSERVED_AT}" \
            --json \
            2> >(tee "${EVIDENCE_DIR}/container-runtime-vulnerability-verification.log" >&2) \
            | tee "${EVIDENCE_DIR}/container-runtime-vulnerability-verification.json"

      - name: Retain OCI reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: container-runtime-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/container-runtime-oci/builder-a-info.log
            /tmp/container-runtime-oci/builder-b-info.log
            /tmp/container-runtime-oci/buildx-version.log
            /tmp/container-runtime-oci/docker-version.log
            /tmp/container-runtime-oci/container-runtime-oci-verification.json
            /tmp/container-runtime-oci/container-runtime-oci-verification.log
            /tmp/container-runtime-oci/syft-pull.log
            /tmp/container-runtime-oci/syft-image-inspect.json
            /tmp/container-runtime-oci/sbom-a/container-runtime.sbom.syft.json
            /tmp/container-runtime-oci/sbom-b/container-runtime.sbom.syft.json
            /tmp/container-runtime-oci/container-runtime-sbom-verification.json
            /tmp/container-runtime-oci/container-runtime-sbom-verification.log
            /tmp/container-runtime-oci/grype-pull.log
            /tmp/container-runtime-oci/grype-image-index.json
            /tmp/container-runtime-oci/grype-image-inspect.json
            /tmp/container-runtime-oci/grype-db.tar.zst
            /tmp/container-runtime-oci/grype-db-status-a.json
            /tmp/container-runtime-oci/grype-db-status-b.json
            /tmp/container-runtime-oci/vulnerability-scan-inputs-before.txt
            /tmp/container-runtime-oci/vulnerability-scan-inputs-after.txt
            /tmp/container-runtime-oci/grype-db-a/6/import.json
            /tmp/container-runtime-oci/grype-db-b/6/import.json
            /tmp/container-runtime-oci/scan-a/container-runtime.vulnerabilities.grype.json
            /tmp/container-runtime-oci/scan-b/container-runtime.vulnerabilities.grype.json
            /tmp/container-runtime-oci/container-runtime-vulnerability-verification.json
            /tmp/container-runtime-oci/container-runtime-vulnerability-verification.log
            /tmp/container-runtime-oci/container-runtime-a.tar
            /tmp/container-runtime-oci/container-runtime-b.tar
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Remove BuildKit builder
        if: always()
        shell: bash
        run: |
          docker buildx rm --force "${BUILDX_BUILDER_A}" || true
          docker buildx rm --force "${BUILDX_BUILDER_B}" || true
