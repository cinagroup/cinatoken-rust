[package]
name = "cinatoken-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
ciborium = "0.2"
cinatoken-api = { path = "../api" }
cinatoken-auth = { path = "../auth" }
cinatoken-billing = { path = "../billing" }
cinatoken-cache = { path = "../cache" }
cinatoken-core = { path = "../core" }
cinatoken-gateway = { path = "../gateway" }
cinatoken-payments = { path = "../payments" }
cinatoken-providers = { path = "../providers" }
cinatoken-relay = { path = "../relay" }
cinatoken-session = { path = "../session" }
cinatoken-ssrf = { path = "../ssrf" }
cinatoken-storage = { path = "../storage" }
cinatoken-tasks = { path = "../tasks" }
cinatoken-tokenizer = { path = "../tokenizer" }
cinatoken-wfp-authority = { path = "../wfp-authority" }
console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }
hmac.workspace = true
js-sys = "0.3"
regex.workspace = true
rsa = { version = "0.9", features = ["pem", "sha2"] }
rust_decimal = { version = "1", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
sha1.workspace = true
sha2.workspace = true
url.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { workspace = true, features = ["d1", "queue"] }

# bcrypt (via cinatoken-auth) pulls getrandom, which on wasm32 must use the
# JS-based entropy source. Enable the `js` feature so bcrypt can run inside the
# Worker when verifying passwords at login.
getrandom = { version = "0.2", features = ["js"] }
md5.workspace = true
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
