name = "cinatoken-container-egress-local"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-17"
workers_dev = false
preview_urls = false

[build]
command = "bun ../../tools/build_worker.mjs --crate container-egress --release"
cwd = "crates/container-egress"

[observability]
enabled = true
head_sampling_rate = 1

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
CINATOKEN_CONTAINER_PROVIDER_EGRESS_ENABLED = "false"
CINATOKEN_CONTAINER_PROVIDER_MODEL = ""

[env.staging]
name = "cinatoken-container-egress-staging"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[env.staging.vars]
CINATOKEN_CONTAINER_PROVIDER_EGRESS_ENABLED = "false"
CINATOKEN_CONTAINER_PROVIDER_MODEL = ""

[env.production]
name = "cinatoken-container-egress-production"

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
CINATOKEN_CONTAINER_PROVIDER_EGRESS_ENABLED = "false"
CINATOKEN_CONTAINER_PROVIDER_MODEL = ""

# This secret belongs only to the private egress Worker. It must not be attached
# to the Controller Worker, Container environment, or edge Worker.
# wrangler secret put CINATOKEN_CONTAINER_PROVIDER_API_KEY --config crates/container-egress/wrangler.toml
