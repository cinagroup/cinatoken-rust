name = "cinatoken-wfp-tenant"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]

[build]
command = "bun ../../tools/build_worker.mjs --crate wfp-tenant --release"
cwd = "crates/wfp-tenant"

[vars]
CINATOKEN_TENANT_ID = "local"
CINATOKEN_WFP_WORKER_NAME = "cinatoken-wfp-tenant"
CF_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
CINATOKEN_WFP_OUTBOUND_AUTH_MODE = "platform-outbound-v1"

# Cloudflare AI authentication belongs to the dispatch namespace outbound
# Worker. Never bind CF_API_TOKEN or another platform bearer to this tenant.
# Bind only the per-worker derived key. Never expose the platform master secret here.
# wrangler secret put WFP_RELAY_AUTHORITY_KEY

# Local/default external replay guard. Artifact uploads bind the environment-
# specific platform Worker script explicitly in multipart metadata.
[[durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"
script_name = "cinatoken-rust-api"
