name = "cinatoken-wfp-outbound"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[build]
command = "bun ../../tools/build_worker.mjs --crate wfp-outbound --release"
cwd = "crates/wfp-outbound"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
CLOUDFLARE_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
AI_GATEWAY_ID_OPENAI_CHAT = ""
AI_GATEWAY_ID_OPENAI_RESPONSES = ""
AI_GATEWAY_ID_ANTHROPIC_MESSAGES = ""
AI_GATEWAY_ID_AI_RUN = ""
AI_GATEWAY_REQUEST_TIMEOUT_MS = "30000"
AI_GATEWAY_MAX_ATTEMPTS = "1"
AI_GATEWAY_RETRY_DELAY_MS = ""
AI_GATEWAY_BACKOFF = ""
AI_GATEWAY_CACHE_TTL_SECONDS = ""
AI_GATEWAY_SKIP_CACHE = ""
AI_GATEWAY_COLLECT_LOG = "true"

[[durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"
script_name = "cinatoken-rust-api"

[env.staging.vars]
CLOUDFLARE_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
AI_GATEWAY_ID_OPENAI_CHAT = ""
AI_GATEWAY_ID_OPENAI_RESPONSES = ""
AI_GATEWAY_ID_ANTHROPIC_MESSAGES = ""
AI_GATEWAY_ID_AI_RUN = ""
AI_GATEWAY_REQUEST_TIMEOUT_MS = "30000"
AI_GATEWAY_MAX_ATTEMPTS = "1"
AI_GATEWAY_RETRY_DELAY_MS = ""
AI_GATEWAY_BACKOFF = ""
AI_GATEWAY_CACHE_TTL_SECONDS = ""
AI_GATEWAY_SKIP_CACHE = ""
AI_GATEWAY_COLLECT_LOG = "true"

[[env.staging.durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"
script_name = "cinatoken-rust-api-staging"

[env.production.vars]
CLOUDFLARE_ACCOUNT_ID = ""
AI_GATEWAY_ID = ""
AI_GATEWAY_ID_OPENAI_CHAT = ""
AI_GATEWAY_ID_OPENAI_RESPONSES = ""
AI_GATEWAY_ID_ANTHROPIC_MESSAGES = ""
AI_GATEWAY_ID_AI_RUN = ""
AI_GATEWAY_REQUEST_TIMEOUT_MS = "30000"
AI_GATEWAY_MAX_ATTEMPTS = "1"
AI_GATEWAY_RETRY_DELAY_MS = ""
AI_GATEWAY_BACKOFF = ""
AI_GATEWAY_CACHE_TTL_SECONDS = ""
AI_GATEWAY_SKIP_CACHE = ""
AI_GATEWAY_COLLECT_LOG = "true"

[[env.production.durable_objects.bindings]]
name = "WFP_AUTHORITY_REPLAY"
class_name = "WfpAuthorityReplay"
script_name = "cinatoken-rust-api"

# This secret belongs only to the outbound Worker. It must never be attached to
# a WFP tenant script or reused as the namespace deployment credential.
# wrangler secret put CINATOKEN_WFP_OUTBOUND_AI_TOKEN --config crates/wfp-outbound/wrangler.toml
